#es3

program = Let('x', Num(1),
           Let('f', Fun([], Var('x')),
            Let('g', Fun([],
                    Let('x', Num(99),
                        Call(FunName('f'), []))),
             Call(FunName('g'), []))))


Il static link di f cambia tra i due scoping? Perché?
Cambia perché con lo scope statico f() punta all'ambiente globale, mentre con lo scope dinamico f() punta all'ambiente di g() che è il chiamante di f().
Il dynamic link cambia? Perché? No perché il chiamante di f() è sempre g() in entrambi i casi.
Quale scoping produce il risultato 1? Quale produce 99? Lo scope statico produce 1, mentre lo scope dinamico produce 99.


