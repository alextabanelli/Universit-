#Prima tipologia di scope: statico e dinamico
#es1
x = 5
f = fun() { x }
x = 99
f()

scope statico: f() -> 5
scope dinamico: f() -> 99

#es2
a = 1
g = fun() { a + 1 }
let a = 10 in g()

scope statico: g() -> 1 + 1 -> 2
scope dinamico: g() -> 10 + 1 -> 11



#es3
x = 10
f = fun(n) { x = x + n; x }
g = fun()  { let x = 0 in f(5) }
f(1) + g()

esecuzione scope statico:
f(1) -> x = 11 -> 11
g() -> f(5) -> x = 11+5 -> 16
f(1) + g() -> 11 + 16 -> 27

esecuzione scope dinamico:
f(1) -> x = 11 -> 11
g() -> f(5) -> x = 0+5 -> 5
f(1) + g() -> 11 + 5 -> 16


#es4
x = 1
f = fun() { x }
g = fun() { let x = 2 in f() }
h = fun() { let x = 3 in g() }
h()

esecuzione scope statico:
h()-> g() -> f() -> 1
esecuzione scope dinamico:
h()-> g() -> f() -> 2


#Seconda tipologia di scope: Record di Attivazione e Display
#es1

program = Let('x', Num(10),
           Let('f', Fun(['a'], BinOp('+', Var('a'), Var('x'))),
            Call(FunName('f'), [Num(5)])))

Interpreter(scoping='static', passing='value', show_ar=True).run(program)

x=10
f = fun(a) { a + x }
f(5)

Quanti AR vengono stampati? 1
Qual è la variabile locale nell AR? a = 5
Verso quale ambiente punta lo static link? ambiente globale (main non correttissimo)
'
╔═ Record di Attivazione ══════════════════════════════════╗
║  call frame (a)   [profondità lessicale: 1]              ║
╠══════════════════════════════════════════════════════════╣
║  variabili locali:                                       ║
║    a = 5                                                 ║
╠══════════════════════════════════════════════════════════╣
║  static link  → [let f]  ...  {x=10, f=<fun(a)>}         ║
║  dynamic link → [Ambiente globale]  (chiamante)          ║
╚══════════════════════════════════════════════════════════╝
'

#es2

program = Let('x', Num(1),
           Let('f', Fun(['a'],
                   Let('y', Num(2),
                       BinOp('+', Var('a'), Var('y')))),
            Let('g', Fun([],
                    Call(FunName('f'), [Num(10)])),
             Call(FunName('g'), []))))


depth	AR corrente	contenuto
0	    ?	        ?
1	    ?	        ?
2	    ?	        ?


x=1
f = fun(a) { y = 2, a + y }
g = fun() { f(10) }
g()



